<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>内服 連想トレーニング</title>
<meta name="theme-color" content="#15332d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="内服連想" />
<meta name="application-name" content="内服連想" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper: #f3efe4;
    --ink: #15332d;
    --ink-soft: #4a5f59;
    --teal: #1f6f63;
    --gold: #b8862f;
    --clay: #c0553c;
    --line: #d8d1bf;
  }
  body {
    font-family: 'Zen Kaku Gothic New', -apple-system, 'Hiragino Sans', sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #e9e3d2 0%, transparent 60%), var(--paper);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 22px 18px 40px; }

  .hd { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .hd-mark {
    width: 46px; height: 46px; flex: none; display: grid; place-items: center;
    background: var(--ink); color: var(--paper); border-radius: 12px;
    font-size: 24px; font-weight: 900; box-shadow: 4px 4px 0 var(--gold);
  }
  .hd h1 { font-size: 21px; font-weight: 900; letter-spacing: .02em; }
  .sub { margin-top: 3px; font-size: 12.5px; color: var(--ink-soft); }
  .arr { color: var(--gold); font-weight: 700; }

  .bar-wrap { margin-bottom: 16px; }
  .bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
  .seg { display: block; transition: flex-grow .5s ease; min-width: 0; }
  .seg.mastered { background: var(--teal); }
  .seg.learning { background: var(--gold); }
  .seg.fresh { background: #e3ddcc; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .dot.mastered { background: var(--teal); }
  .dot.learning { background: var(--gold); }
  .dot.fresh { background: #cfc7b2; }
  .muted { color: #9a9482; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
  .chip {
    font-family: inherit; font-size: 12.5px; font-weight: 500; padding: 6px 12px;
    border-radius: 99px; cursor: pointer; border: 1.5px solid var(--line);
    background: #fff; color: var(--ink-soft); transition: all .15s;
  }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .card-area { perspective: 1400px; }
  .card {
    position: relative; width: 100%; min-height: 360px; transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4,.2,.2,1); cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; border-radius: 18px;
    padding: 26px 24px; border: 1.5px solid var(--line); display: flex; flex-direction: column;
    box-shadow: 0 18px 40px -28px rgba(21,51,45,.5);
  }
  .front { background: linear-gradient(140deg, #ffffff 0%, #fbf8ef 100%); align-items: center; justify-content: center; text-align: center; }
  .back { background: linear-gradient(140deg, #16382f 0%, #1f5048 100%); color: #f3efe4; transform: rotateY(180deg); justify-content: flex-start; padding-top: 44px; gap: 11px; overflow-y: auto; }
  .cat-tag { position: absolute; top: 16px; left: 18px; font-size: 11px; letter-spacing: .08em; font-weight: 700; color: var(--gold); }
  .back .cat-tag { color: #e9c97e; }
  .label { font-size: 12px; letter-spacing: .14em; color: var(--ink-soft); margin-bottom: 10px; }
  .brand { font-size: 30px; font-weight: 900; line-height: 1.25; letter-spacing: .01em; }
  .hint { margin-top: 22px; font-size: 11.5px; color: #b3ab97; }
  .row { border-bottom: 1px solid rgba(255,255,255,.12); padding-bottom: 11px; }
  .row:last-child { border-bottom: none; }
  .k { display: block; font-size: 11px; letter-spacing: .1em; color: #9fc4ba; margin-bottom: 4px; }
  .v { font-size: 16px; line-height: 1.45; }
  .v.strong { font-size: 24px; font-weight: 900; }
  .v.hx { color: #f0e2bd; }

  .controls { margin-top: 18px; }
  .btn { font-family: inherit; font-weight: 700; font-size: 15px; border: none; border-radius: 13px; padding: 15px; cursor: pointer; width: 100%; transition: transform .1s, filter .15s; }
  .btn:active { transform: translateY(1px); }
  .primary { background: var(--ink); color: var(--paper); }
  .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dont { background: #fff; color: var(--clay); border: 1.5px solid var(--clay); }
  .know { background: var(--teal); color: #fff; }
  .key { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; font-size: 11px; margin-left: 6px; background: rgba(0,0,0,.14); }
  .dont .key { background: rgba(192,85,60,.16); }
  .hidden { display: none !important; }

  .meta { margin-top: 14px; font-size: 12px; color: var(--ink-soft); text-align: center; }
  .toast { margin-top: 10px; text-align: center; font-size: 12.5px; font-weight: 500; padding: 7px; border-radius: 9px; animation: fade .4s ease; }
  .toast.know { background: rgba(31,111,99,.12); color: var(--teal); }
  .toast.dont { background: rgba(192,85,60,.12); color: var(--clay); }
  @keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }

  .ft { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .reset { font-family: inherit; font-size: 12.5px; color: var(--clay); background: none; border: 1.5px solid transparent; cursor: pointer; padding: 6px 14px; border-radius: 8px; transition: border-color .15s; }
  .reset:hover { border-color: var(--clay); }
  .note { font-size: 11px; color: #9a9482; text-align: center; }


  .card.instant { transition: none !important; }
  .origin { color: #d9c79a; font-size: 14px; line-height: 1.5; }

  .list-launch { margin-top: 22px; display: flex; justify-content: center; }
  .listbtn {
    font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer;
    padding: 11px 18px; border-radius: 11px; border: 1.5px solid var(--ink);
    background: #fff; color: var(--ink); transition: all .15s;
  }
  .listbtn:active { transform: translateY(1px); }

  .overlay {
    position: fixed; inset: 0; background: rgba(21,51,45,.45);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .sheet {
    background: var(--paper); width: 100%; max-width: 720px; max-height: 82vh;
    border-radius: 20px 20px 0 0; padding: 18px 18px 28px; overflow-y: auto;
    box-shadow: 0 -10px 40px -10px rgba(21,51,45,.4);
    animation: slideup .28s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes slideup { from { transform: translateY(40px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
  .sheet-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .sheet-hd span { font-size: 17px; font-weight: 900; }
  .closebtn { font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    border: none; background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 9px; }
  .sheet-note { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 14px; }
  .empty-list { text-align: center; color: var(--teal); padding: 30px 0; font-weight: 700; }
  .li { border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 14px; margin-bottom: 9px; background: #fff; }
  .li-brand { font-size: 17px; font-weight: 900; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .li-generic { font-size: 14px; font-weight: 700; color: var(--teal); margin-top: 3px; }
  .li-klass { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .li-hx { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }
  .li-origin { font-size: 12px; color: #9a7d3a; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .badge { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 99px; }
  .badge.miss { background: rgba(192,85,60,.14); color: var(--clay); }
  .badge.new { background: #ece6d6; color: #87836f; }

  @media (max-width: 480px) {
    .card { min-height: 400px; }
    .brand { font-size: 25px; }
    .v.strong { font-size: 21px; }
    .v { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hd">
    <div class="hd-mark">膳</div>
    <div>
      <h1>内服 連想トレーニング</h1>
      <p class="sub">商品名 <span class="arr">→</span> 一般名 <span class="arr">→</span> 薬効群 <span class="arr">→</span> 既往</p>
    </div>
  </header>

  <div class="bar-wrap">
    <div class="bar">
      <span class="seg mastered" id="segMastered"></span>
      <span class="seg learning" id="segLearning"></span>
      <span class="seg fresh" id="segFresh"></span>
    </div>
    <div class="legend">
      <span><i class="dot mastered"></i>定着 <b id="nMastered">0</b></span>
      <span><i class="dot learning"></i>学習中 <b id="nLearning">0</b></span>
      <span><i class="dot fresh"></i>未着手 <b id="nFresh">0</b></span>
      <span class="muted">／ 全 <b id="nTotal">0</b></span>
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="card-area" id="cardArea">
    <div class="card" id="card">
      <div class="face front">
        <div class="label">商品名</div>
        <div class="brand" id="brand"></div>
        <div class="hint">タップ / スペースキーで答えを表示</div>
      </div>
      <div class="face back">
        <div class="cat-tag" id="backCat"></div>
        <div class="row"><span class="k">一般名</span><span class="v strong" id="generic"></span></div>
        <div class="row"><span class="k">薬効群</span><span class="v" id="klass"></span></div>
        <div class="row"><span class="k">推測される既往</span><span class="v hx" id="hx"></span></div>
        <div class="row" id="originRow"><span class="k">覚え方・由来</span><span class="v origin" id="origin"></span></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn primary" id="flipBtn">答えを見る</button>
      <div class="grade hidden" id="gradeBtns">
        <button class="btn dont" id="dontBtn">わからなかった <span class="key">1</span></button>
        <button class="btn know" id="knowBtn">わかった <span class="key">2</span></button>
      </div>
    </div>

    <div class="meta"><span id="cardStat"></span><span class="muted" id="sessionStat"></span></div>
    <div id="toastSlot"></div>
  </div>

  <div class="card-area hidden" id="emptyArea">
    <p class="note" style="padding:60px 0;text-align:center;">カテゴリを1つ以上選んでください。</p>
  </div>

  <div class="list-launch">
    <button class="listbtn" id="openListBtn">苦手リスト（箱1）を表示</button>
  </div>

  <div class="overlay hidden" id="listOverlay">
    <div class="sheet">
      <div class="sheet-hd">
        <span id="listTitle">箱1の薬</span>
        <button class="closebtn" id="closeListBtn">閉じる</button>
      </div>
      <div class="sheet-note">一度学習して間違えたカード（箱1）です。未学習は除いています。ジャンルは伏せています。</div>
      <div id="listBody"></div>
    </div>
  </div>

  <footer class="ft">
    <button class="reset" id="resetBtn">進捗をリセット</button>
    <span class="note">進捗はこの端末のブラウザに自動保存されます（アカウント不要）。</span>
  </footer>
</div>

<script>
const DECK = [
  { id:"d01", cat:"循環器", brand:"アムロジン / ノルバスク", generic:"アムロジピン", klass:"Ca拮抗薬（ジヒドロピリジン系）", hx:"高血圧、狭心症", origin:"一般名アムロジピンから。別名ノルバスクは Norvasc。" },
  { id:"d02", cat:"循環器", brand:"アダラート", generic:"ニフェジピン", klass:"Ca拮抗薬", hx:"高血圧、狭心症" },

  { id:"d05", cat:"循環器", brand:"ブロプレス", generic:"カンデサルタン", klass:"ARB", hx:"高血圧、慢性心不全", origin:"blood pressure（血圧）を press down するイメージの命名と言われる。" },

  { id:"d09", cat:"循環器", brand:"オルメテック", generic:"オルメサルタン", klass:"ARB", hx:"高血圧" },
  { id:"d10", cat:"循環器", brand:"レニベース", generic:"エナラプリル", klass:"ACE阻害薬", hx:"高血圧、慢性心不全（空咳に注意）", origin:"レニン-アンジオテンシン系（ACE）に作用＝renal/renin に通じる。" },
  { id:"d11", cat:"循環器", brand:"メインテート", generic:"ビソプロロール", klass:"β遮断薬（β1選択）", hx:"高血圧、心不全、頻脈性不整脈、狭心症", origin:"心機能を maintain（維持）する → 慢性心不全。" },
  { id:"d12", cat:"循環器", brand:"アーチスト", generic:"カルベジロール", klass:"αβ遮断薬", hx:"慢性心不全、高血圧、頻脈性心房細動" },

  { id:"d15", cat:"循環器", brand:"フルイトラン", generic:"トリクロルメチアジド", klass:"サイアザイド系利尿薬", hx:"高血圧、浮腫" },
  { id:"d16", cat:"循環器", brand:"ニトロール / ニトロペン", generic:"硝酸イソソルビド / ニトログリセリン", klass:"硝酸薬", hx:"狭心症、心不全", origin:"ニトロ＝硝酸（nitro-）。狭心症発作に。" },

const CATS = [...new Set(DECK.map(c => c.cat))];
const STORAGE_KEY = "yakuzai_progress_v2";
const BOX_WEIGHT = { 1:18, 2:9, 3:5, 4:2, 5:1 };
const MAX_BOX = 5;

function defaultStat(){ return { box:1, correct:0, wrong:0, lastSeen:0, seen:0 }; }

// ---- 状態 ----
let progress = {};
let activeCats = new Set(CATS);
let currentId = null;
let flipped = false;
let sessionCount = 0;
let lastId = null;

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    progress = raw ? JSON.parse(raw) : {};
  } catch(e){ progress = {}; }
}
function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch(e){}
}

function pool(){ return DECK.filter(c => activeCats.has(c.cat)); }

function pickNext(excludeId){
  const p = pool();
  if(p.length === 0) return null;
  let cand = (p.length > 1 && excludeId) ? p.filter(c => c.id !== excludeId) : p;
  const now = Date.now();
  const weights = cand.map(c => {
    const st = progress[c.id] || defaultStat();
    let w = BOX_WEIGHT[st.box] || 1;
    if(now - (st.lastSeen||0) < 25000) w *= 0.3;
    if(!st.seen) w *= 1.6;
    return w;
  });
  const total = weights.reduce((a,b)=>a+b, 0);
  let r = Math.random() * total;
  for(let i=0;i<cand.length;i++){ r -= weights[i]; if(r <= 0) return cand[i].id; }
  return cand[cand.length-1].id;
}

// ---- DOM ----
const $ = id => document.getElementById(id);

function renderChips(){
  const box = $("chips");
  box.innerHTML = "";
  CATS.forEach(cat => {
    const b = document.createElement("button");
    b.className = "chip" + (activeCats.has(cat) ? " on" : "");
    b.textContent = cat;
    b.onclick = () => {
      if(activeCats.has(cat)){ if(activeCats.size > 1) activeCats.delete(cat); }
      else activeCats.add(cat);
      const stillValid = currentId && pool().some(c => c.id === currentId);
      if(!stillValid){ currentId = pickNext(lastId); flipped = false; }
      renderAll();
    };
    box.appendChild(b);
  });
}

function renderStats(){
  const p = pool();
  let mastered=0, learning=0, fresh=0;
  p.forEach(c => {
    const st = progress[c.id];
    if(!st || !st.seen) fresh++;
    else if(st.box >= 4) mastered++;
    else learning++;
  });
  $("segMastered").style.flexGrow = mastered || 0.0001;
  $("segLearning").style.flexGrow = learning || 0.0001;
  $("segFresh").style.flexGrow = fresh || 0.0001;
  $("nMastered").textContent = mastered;
  $("nLearning").textContent = learning;
  $("nFresh").textContent = fresh;
  $("nTotal").textContent = p.length;
}

function renderCard(){
  const cur = DECK.find(c => c.id === currentId);
  if(!cur){
    $("cardArea").classList.add("hidden");
    $("emptyArea").classList.remove("hidden");
    return;
  }
  $("cardArea").classList.remove("hidden");
  $("emptyArea").classList.add("hidden");

  $("backCat").textContent = cur.cat;
  $("brand").textContent = cur.brand;
  $("generic").textContent = cur.generic;
  $("klass").textContent = cur.klass;
  $("hx").textContent = cur.hx;
  if(cur.origin){ $("origin").textContent = cur.origin; $("originRow").style.display = ""; }
  else { $("originRow").style.display = "none"; }

  $("card").classList.toggle("flipped", flipped);
  $("flipBtn").classList.toggle("hidden", flipped);
  $("gradeBtns").classList.toggle("hidden", !flipped);

  const st = progress[cur.id];
  $("cardStat").textContent = (st && st.seen)
    ? `この薬：箱 ${st.box}/${MAX_BOX}・正 ${st.correct} / 誤 ${st.wrong}`
    : "この薬は初出題";
  $("sessionStat").textContent = `　今セッション ${sessionCount} 枚`;
}

function renderAll(){ renderStats(); renderCard(); }

function flip(){ flipped = !flipped; renderCard(); }

function toast(known){
  const slot = $("toastSlot");
  slot.innerHTML = "";
  const t = document.createElement("div");
  t.className = "toast " + (known ? "know" : "dont");
  t.textContent = known ? "定着箱を1つ前進" : "苦手箱へ — 早めに再出題します";
  slot.appendChild(t);
  setTimeout(() => { if(slot.firstChild === t) slot.innerHTML = ""; }, 2200);
}

function grade(known){
  const cur = DECK.find(c => c.id === currentId);
  if(!cur || !flipped) return;
  const st = Object.assign(defaultStat(), progress[cur.id] || {});
  st.seen++; st.lastSeen = Date.now();
  if(known){ st.correct++; st.box = Math.min(MAX_BOX, st.box + 1); }
  else { st.wrong++; st.box = 1; }
  progress[cur.id] = st;
  save();
  sessionCount++;
  lastId = cur.id;
  // 次カードへ移る瞬間はめくり戻しアニメを無効化（裏面のチラ見え防止）
  const cardEl = $("card");
  cardEl.classList.add("instant");
  currentId = pickNext(cur.id);
  flipped = false;
  renderAll();
  void cardEl.offsetWidth; // リフロー
  cardEl.classList.remove("instant");
  toast(known);
}

function reset(){
  progress = {}; save(); sessionCount = 0; lastId = null;
  const cardEl = $("card");
  cardEl.classList.add("instant");
  currentId = pickNext(null); flipped = false;
  $("toastSlot").innerHTML = "";
  renderAll();
  void cardEl.offsetWidth;
  cardEl.classList.remove("instant");
}

// ---- イベント ----
$("card").onclick = flip;
$("flipBtn").onclick = (e) => { e.stopPropagation(); flip(); };
$("knowBtn").onclick = (e) => { e.stopPropagation(); grade(true); };
$("dontBtn").onclick = (e) => { e.stopPropagation(); grade(false); };
$("resetBtn").onclick = () => { if(confirm("すべての学習進捗を消去します。よろしいですか？")) reset(); };

function renderList(){
  const items = pool().filter(c => { const st = progress[c.id]; return st && st.seen > 0 && st.box === 1; });
  $("listTitle").textContent = `箱1の薬（${items.length}）`;
  const body = $("listBody");
  if(items.length === 0){
    body.innerHTML = '<p class="empty-list">間違えて箱1に戻った薬はありません。よく定着しています。</p>';
    return;
  }
  body.innerHTML = "";
  items.forEach(c => {
    const st = progress[c.id];
    const tag = (st && st.wrong > 0) ? '<span class="badge miss">誤'+st.wrong+'</span>'
              : (st && st.seen ? '' : '<span class="badge new">未学習</span>');
    const origin = c.origin ? '<div class="li-origin">'+c.origin+'</div>' : '';
    const el = document.createElement("div");
    el.className = "li";
    el.innerHTML =
      '<div class="li-brand">'+c.brand+' '+tag+'</div>' +
      '<div class="li-generic">'+c.generic+'</div>' +
      '<div class="li-klass">'+c.klass+'</div>' +
      '<div class="li-hx">既往: '+c.hx+'</div>' + origin;
    body.appendChild(el);
  });
}
function openList(){ renderList(); $("listOverlay").classList.remove("hidden"); }
function closeList(){ $("listOverlay").classList.add("hidden"); }
$("openListBtn").onclick = openList;
$("closeListBtn").onclick = closeList;
$("listOverlay").onclick = (e) => { if(e.target === $("listOverlay")) closeList(); };

document.addEventListener("keydown", (e) => {
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); }
  else if(flipped && (e.key === "1" || e.key === "j")) grade(false);
  else if(flipped && (e.key === "2" || e.key === "k")) grade(true);
});

// ---- 起動 ----
load();
renderChips();
currentId = pickNext(null);
renderAll();
</script>

<script>
/* ============================================================
   PWA セットアップ（単一ファイルのまま）
   - アイコンを端末上で生成（日本語フォントを利用）
   - manifest を Blob で生成して注入 → ホーム画面でアプリ化
   ============================================================ */
(function setupPWA(){
  function makeIcon(size){
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const x = c.getContext("2d");
    // 背景グラデーション
    const g = x.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, "#15332d");
    g.addColorStop(1, "#1f5048");
    x.fillStyle = g;
    x.fillRect(0, 0, size, size);
    // 中央の文字（マスク安全領域内に収める）
    x.fillStyle = "#f3efe4";
    x.textAlign = "center";
    x.textBaseline = "middle";
    x.font = "900 " + Math.round(size * 0.46) + "px 'Zen Kaku Gothic New', sans-serif";
    x.fillText("膳", size / 2, size * 0.44);
    // 金色のアクセントバー
    x.fillStyle = "#b8862f";
    const bw = size * 0.30, bh = size * 0.045, bx = (size - bw) / 2, by = size * 0.72, r = bh / 2;
    x.beginPath();
    x.moveTo(bx + r, by);
    x.arcTo(bx + bw, by, bx + bw, by + bh, r);
    x.arcTo(bx + bw, by + bh, bx, by + bh, r);
    x.arcTo(bx, by + bh, bx, by, r);
    x.arcTo(bx, by, bx + bw, by, r);
    x.closePath();
    x.fill();
    return c.toDataURL("image/png");
  }

  let done = false;
  function inject(){
    if (done) return;
    done = true;
    let icon192, icon512;
    try {
      icon192 = makeIcon(192);
      icon512 = makeIcon(512);
    } catch (e) { return; }

    const manifest = {
      name: "内服 連想トレーニング",
      short_name: "内服連想",
      start_url: ".",
      scope: ".",
      display: "standalone",
      orientation: "portrait",
      background_color: "#f3efe4",
      theme_color: "#15332d",
      icons: [
        { src: icon192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
        { src: icon512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    try {
      const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      const mlink = document.createElement("link");
      mlink.rel = "manifest";
      mlink.href = URL.createObjectURL(blob);
      document.head.appendChild(mlink);
    } catch (e) {}

    const apple = document.createElement("link");
    apple.rel = "apple-touch-icon";
    apple.setAttribute("sizes", "192x192");
    apple.href = icon192;
    document.head.appendChild(apple);

    const fav = document.createElement("link");
    fav.rel = "icon";
    fav.type = "image/png";
    fav.href = icon192;
    document.head.appendChild(fav);
  }

  // Webフォント読み込み後に生成（未対応環境では即時）
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(inject).catch(inject);
    setTimeout(inject, 1500); // フォント取得失敗時の保険
  } else {
    inject();
  }
})();
</script>
